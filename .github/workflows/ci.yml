name: Test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - run: node --version && node --test
      - name: Install pinned browser test client
        run: npm install --prefix "$RUNNER_TEMP/ui-qa" --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.51.1
      - name: Desktop and mobile browser smoke test
        env:
          QA_PLAYWRIGHT_ROOT: ${{ runner.temp }}/ui-qa
        run: node scripts/ui-smoke.mjs
