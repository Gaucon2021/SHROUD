<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHROUD | Privacy routing</title><style>*{box-sizing:border-box}body{font:16px system-ui;background:#10131b;color:#f4f4f6;margin:0}main{max-width:1100px;margin:auto;padding:48px 24px}small{color:#7763c9;letter-spacing:.15em}h1{font-size:clamp(48px,9vw,96px);margin:12px 0}p{color:#b8bfca}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px;margin-top:32px}article{background:#1b202b;border:1px solid #343b49;border-radius:16px;padding:20px}textarea,pre{width:100%;min-height:300px;background:#10131b;color:#e4e6eb;border:1px solid #343b49;border-radius:8px;padding:14px;white-space:pre-wrap;overflow-wrap:anywhere}button{background:#7763c9;color:#10131b;border:0;padding:12px 20px;border-radius:8px;font-weight:bold;cursor:pointer}output{display:block;font-size:24px;font-weight:bold;color:#7763c9;margin:12px 0}</style><main><small>DEVELOPMENT PROTOTYPE / SYNTHETIC EVIDENCE</small><h1>SHROUD</h1><p>Privacy routing. Evaluate a scenario locally. No live integration is claimed.</p><section><article><h2>Scenario input</h2><textarea id="input" aria-label="Scenario JSON"></textarea><button id="run">Evaluate scenario</button></article><article><h2>Decision & evidence</h2><output id="decision" aria-live="polite"></output><pre id="result"></pre></article></section></main><script type="module">import {evaluate} from './core.mjs';import fixture from './fixture.mjs';const input=document.querySelector('#input'),result=document.querySelector('#result'),decision=document.querySelector('#decision');input.value=JSON.stringify(fixture,null,2);document.querySelector('#run').onclick=()=>{try{const r=evaluate(JSON.parse(input.value));decision.textContent=r.decision;result.textContent=JSON.stringify(r,null,2)}catch(e){decision.textContent='INVALID INPUT';result.textContent=String(e.message)}};document.querySelector('#run').click();</script></html>
